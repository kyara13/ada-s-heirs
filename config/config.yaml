# Configuración del pipeline: para cambiar un modelo o un umbral, solo tocamos este fichero.

paths:
  videos: data/videos
  outputs: outputs
  annotations: data/annotations

video:
  fps_sample: 2                # fotogramas por segundo que analizamos
  max_side: 1280               # reducimos los vídeos más grandes (0 = tamaño original)
  max_seconds: 0               # 0 = vídeo entero; 300 = primeros 5 min (pruebas)

shots:
  enabled: true
  detector: adaptive
  luma_only: true              # solo brillo: lo necesitamos para el cine en blanco y negro
  threshold: 27.0              # solo lo usamos con el detector content
  min_shot_s: 1.0

detection:
  model: torchvision_fasterrcnn # torchvision_fasterrcnn (GPU) | torchvision_fasterrcnn_mobilenet (CPU)
  min_score: 0.6
  min_box_ratio: 0.005         # ignoramos personas que ocupan menos del 0,5 % de la imagen
  device: auto

tracking:
  model: bytetrack
  activation_threshold: 0.6
  lost_track_buffer: 4         # fotogramas que esperamos a una persona que desaparece
  min_track_frames: 3          # las trayectorias más cortas las tratamos como ruido

faces:
  model: insightface           # none = sin análisis facial (pruebas en el portátil)
  every_n_frames: 1
  min_face_score: 0.5
  device: auto                 # usamos onnxruntime-gpu 1.22.0: las versiones para CUDA 13 no soportan las V100S

aggregation:
  vote_threshold: 0.7          # lo bajamos de 0,8 a 0,7 tras el análisis de sensibilidad (27/10)
  min_votes: 2                 # con menos caras, la persona queda como no_determinado

metrics:
  edge_fraction: 0.1           # primer o último 10 % del vídeo
  protagonist_threshold: 0.5   # a partir de este índice contamos a la persona como protagonista
  # Pesos del índice de protagonismo (justificados en docs/metricas.md)
  weights:
    screen_time: 0.30
    size: 0.20
    centrality: 0.15
    solo: 0.20
    edges: 0.15

llm:
  enabled: false
  model: ""
